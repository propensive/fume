name: CI

# Build and test on every merge into main, via the shared Soundness-application workflow —
# see propensive/.github for what it does and what it expects of this repository (the ./mill
# wrapper, and the version pins in build.mill).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: propensive/.github/.github/workflows/scala-ci.yml@main
    with:
      compile:       fume.client.compile
      publish_local: fume.client
      assembly:      fume.launcher.assembly
      test_assembly: fume.test.assembly
      test_main:     fume.Tests
