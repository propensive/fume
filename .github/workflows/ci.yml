name: CI

# Build and test every pull request and every merge into main, via the shared Soundness-application
# workflow — see propensive/.github for what it does and what it expects of this repository (the
# ./mill wrapper, etc/shared, and the pins in etc/refs).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    uses: propensive/.github/.github/workflows/scala-ci.yml@main
    with:
      compile:       fume.client.compile
      # Both published modules: the launcher resolves `fume-client` as a coordinate, and its
      # POM names `fume-relay`, so both must be in the local ivy repository before assembly.
      publish_local: fume.__
      assembly:      fume.launcher.assembly
      test_assembly: fume.test.assembly
